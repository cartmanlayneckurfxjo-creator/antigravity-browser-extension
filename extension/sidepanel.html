<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Browser Bridge</title>
  <style>
    :root {
      --bg-main: #0a0d14;
      --bg-panel: #111622;
      --bg-subtle: #161e2e;
      --bg-input: #1c2638;
      --border-color: #212e44;
      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 13px;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .logo {
      width: 24px; height: 24px;
      border-radius: 5px;
      display: block;
      object-fit: contain;
    }
    header h1 { font-size: 13px; font-weight: 600; color: var(--text-main); flex: 1; }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-sub);
      background: var(--bg-main);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-dot.connected { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-dot.error     { background: var(--danger); }

    /* ── Page Info Context Bar ── */
    .page-context-bar {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-color);
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      flex-shrink: 0;
    }
    .page-icon { font-size: 12px; }
    .page-details { flex: 1; min-width: 0; }
    .page-title {
      color: var(--text-main);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-url {
      color: #818cf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 10px;
    }
    .context-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--text-sub);
      cursor: pointer;
      user-select: none;
      background: var(--bg-panel);
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }
    .context-toggle input { cursor: pointer; }

    /* ── Tab Views ── */
    .tab-view {
      display: flex;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Tools / Bridge Tab ── */
    .tools-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .actions-grid {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-panel);
      flex-shrink: 0;
    }
    .btn {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-align: center;
    }
    .btn:hover { background: var(--bg-input); color: var(--text-main); border-color: var(--accent-primary); }
    .btn.primary {
      background: var(--accent-gradient);
      color: #fff;
      border-color: transparent;
      font-weight: 500;
    }
    .btn.primary:hover { opacity: 0.9; }

    .log {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-entry {
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 4px;
      background: var(--bg-panel);
      border-left: 3px solid var(--border-color);
      color: var(--text-sub);
      word-break: break-all;
    }
    .log-entry.info  { border-left-color: var(--accent-primary); }
    .log-entry.ok    { border-left-color: var(--success); color: #86efac; }
    .log-entry.err   { border-left-color: var(--danger); color: #fca5a5; }
    .log-entry .ts   { color: var(--text-muted); margin-right: 6px; }

    /* ── Settings Tab ── */
    .settings-view {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .setting-group {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .setting-group label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .setting-input {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text-main);
      font-size: 12px;
      outline: none;
    }
    .setting-input:focus { border-color: var(--accent-primary); }
    .setting-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; }

    /* ── Footer ── */
    footer {
      padding: 6px 12px;
      border-top: 1px solid var(--border-color);
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-panel);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <img class="logo" src="assets/icon32.png" alt="Antigravity">
    <h1>Antigravity Bridge</h1>
    <div class="status-badge" id="statusBadge" title="WebSocket status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Connecting...</span>
    </div>
  </header>



  <!-- Active Page Context Header Bar -->
  <div class="page-context-bar">
    <span class="page-icon">🌐</span>
    <div class="page-details">
      <div class="page-title" id="pageTitle">Detecting page...</div>
      <div class="page-url" id="pageUrl">—</div>
    </div>
  </div>

  <!-- Tools & MCP Logs View -->
  <div class="tab-view" id="view-tools">
    <div class="actions-grid">
      <button class="btn primary" id="btnCapture">📥 Capture Context</button>
      <button class="btn" id="btnScreenshot">📸 Screenshot</button>
      <button class="btn" id="btnTabs">📑 List Tabs</button>
      <button class="btn" id="btnReconnect">🔄 Reconnect WS</button>
    </div>
    <div class="log" id="log"></div>
  </div>



  <!-- Footer -->
  <footer>
    <span>Antigravity Browser Bridge v0.2.0</span>
    <span>ws://localhost:7842</span>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
